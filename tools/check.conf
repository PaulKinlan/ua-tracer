# The gate's command configuration - TRACKED, so it survives a rebuild and is reviewable.
#
# *** THIS FILE IS NOT READ BY THE DEPLOYED GATE BY ITSELF. ***
# ~/fleet/bin/fleet-check sources ONLY $HOME/.fleet/check.conf for CHECK_FAST_CMD, and
# auto-detects only `deno.json` .tasks.check / `package.json` .scripts.test for CHECK_CMD.
# The values below reach the deployed gate on a machine where this project's install step
# has run:
#     bash tools/check-cmd.sh --install
# so the tracked file is the source of truth a reviewer can read, and the install writes
# the copy the gate actually reads. To tune the gate, edit this file and re-run --install;
# a hand-edit of ~/.fleet/check.conf is indistinguishable from a stale install.
#
# SOURCING IS DELIBERATELY STRICT: this file is shell and it is sourced, so a syntax error
# is fatal under the caller's `set -e` and the gate REFUSES TO RUN rather than falling back
# to a command nobody chose. One assignment per line, no command substitution.
#
# WHY ~/.fleet/check.conf IS NOT ENOUGH ON ITS OWN: it is MACHINE-GLOBAL and fleet-check
# reads it for any repo invoked on the host, so the last project to install wins. On this
# VM it was left pointing at another project's python discovery over a tests/ directory
# that does not exist here, which is exactly the false-coverage defect ua-tracer-9me is
# about: a gate that runs a command for the wrong project still reports a verdict.

# The FULL gate: every suite, plus the real-browser journey. `deno task check` is also the
# name fleet-check auto-detects from deno.json, so the task and this value cannot drift.
#
# An empty value here is also valid and equivalent - fleet-check then falls through to its
# deno.json .tasks.check auto-detect, which needs no install step at all. The empty form is
# what this VM currently has installed; both reach the same task. Named explicitly because a
# reviewer should be able to read the exact command the gate runs.
CHECK_CMD="deno task check"

# The FAST gate: fmt + lint + typecheck and only the suites a change affects. It fails
# closed (non-zero) on a path nobody has mapped, and never reaches the network. The fast
# tier has NO auto-detect, so this value is the only way it reaches the deployed gate.
CHECK_FAST_CMD="deno task check:fast"

# Bounds in seconds. Fleet R1 (full) <=300, R2 (fast) <=60. Measured: ~5-9s and ~3-7s.
CHECK_TIMEOUT=300
CHECK_FAST_TIMEOUT=60
