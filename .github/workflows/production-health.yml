# Production health: the two things a deploy has to produce, checked from OUTSIDE with no
# credentials. Both are read from the public /api/health, so this workflow cannot rot when a token
# is rotated and needs nothing from the Deno Deploy console.
#
#  1. `build` is present and non-null — the revision serving uatracer.com emits the platform's build
#     id, i.e. it is a real Deno Deploy revision and not an old one without the field
#     (deploy-check.ts, ua-tracer-ajc). To prove a SPECIFIC landing rolled, run the same tool with
#     `--expect <previous build id>`; the id itself is printed below and in the job summary.
#  2. `repair.expected` is true — ua-tracer-2t9's hourly snapshot repair is REGISTERED in the serving
#     context. /api/health reports `ok: true` whether or not it is, so without this check an
#     unregistered cron is invisible from outside (ua-tracer-ruz). UA_TRACER_CRON=1 lives in the
#     app's Production context on Deno Deploy; the CLI cannot read that context from here.
#     This half currently WARNS rather than fails, deliberately and temporarily: it is a known-false
#     property of production until ua-tracer-ruz is done, and a permanently red check on main trains
#     people to ignore red. The warning names the owner and the fix; ua-tracer-a7x (dependent on
#     ruz) is the flip to a hard failure, so the assertion has an owner and a trigger.
#
# Runs on every push to main (the same push that triggers the deploy) and on demand. Public repo,
# standard runners, no secrets: nothing here needs a token.
name: production-health

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Exit 0 once a build id is present; exit 1 when production cannot be shown to be serving one.
      - name: Production is serving a build (deploy-check.ts)
        run: deno run --allow-net deploy-check.ts --samples 5 --interval 6

      - name: The hourly snapshot repair is registered and running (warns until ua-tracer-ruz)
        run: |
          set -eu
          body=$(curl -fsS https://uatracer.com/api/health)
          printf '%s\n' "$body" | jq -e . >/dev/null
          printf 'build: %s\nrepair: %s\n' "$(printf '%s' "$body" | jq -r '.build // "null"')" "$(printf '%s' "$body" | jq -c '.repair')"
          expected=$(printf '%s' "$body" | jq -r '.repair.expected')
          {
            echo "### Production health"
            echo ""
            echo "- build: \`$(printf '%s' "$body" | jq -r '.build // "null"')\`"
            echo "- repair: \`$(printf '%s' "$body" | jq -c '.repair')\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$expected" != "true" ]; then
            echo "::warning title=TEMPORARY: the hourly snapshot repair is NOT registered::/api/health reports repair.expected=${expected}, so ua-tracer-2t9's hourly repair never runs and lastRun stays null. This is a known-false property of production, it is TEMPORARY, and ua-tracer-ruz owns the fix: set UA_TRACER_CRON=1 in the ua-tracer app's Production context on Deno Deploy. The variable lives with the app, not with this repo, so a deploy from GitHub does not carry it. ua-tracer-a7x (dependent on ua-tracer-ruz) turns this warning into a hard failure; until then the build check above stays the hard one."
            {
              echo ""
              echo "> [!WARNING]"
              echo "> **TEMPORARY**: the hourly snapshot repair is not registered (\`repair.expected=${expected}\`)."
              echo "> \`ua-tracer-ruz\` owns the fix — set \`UA_TRACER_CRON=1\` in the app's Production context."
              echo "> \`ua-tracer-a7x\` flips this warning into a hard failure."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
